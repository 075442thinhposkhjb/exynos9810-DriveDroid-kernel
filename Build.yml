name: Build N960N Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex \
          build-essential \
          libssl-dev \
          libelf-dev \
          gcc-aarch64-linux-gnu \
          cpio unzip

    - name: Extract Kernel
      run: |
        mkdir kernel
        tar -xzf Kernel.tar.gz -C kernel

    - name: Check defconfig
      run: |
        ls -lh kernel/arch/arm64/configs/ | grep crownlteks

    - name: Build
      run: |
        cd kernel

        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make O=out exynos9810-crownlteks_defconfig_DriveDroid_stable

        make O=out -j$(nproc) Image.gz-dtb

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: N960N-kernel
        path: kernel/out/arch/arm64/boot/Image.gz-dtb
