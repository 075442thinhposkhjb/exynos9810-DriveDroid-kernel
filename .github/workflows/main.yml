name: Build Exynos9810 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev python3 python3-pip git

      - name: Set up Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="${{ github.workspace }}/toolchain/bin/aarch64-linux-android-"
          
          # Cài gdown và kéo file từ Google Drive
          pip install gdown --break-system-packages
          gdown "1Cc3p0wqOXAAzgpxTvZf6oCv_YnU4tzl9" -O kernel-fix.tar.gz
          
          # Giải nén file nén chứa defconfig
          tar -xzf kernel-fix.tar.gz
          
          # Đảm bảo file config nằm đúng vị trí configs của kernel (điều chỉnh lại tên nếu trong file nén cấu trúc khác)
          # cp exynos9810-crownlteks_defconfig_DriveDroid_stable arch/arm64/configs/
          
          make exynos9810-crownlteks_defconfig_DriveDroid_stable
          make -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Kernel-Image
          path: arch/arm64/boot/Image
          
