name: Build Exynos9810 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git

      - name: Set up Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git toolchain

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE="${{ github.workspace }}/toolchain/bin/aarch64-linux-android-"
          
          # Thay tên defconfig của bạn vào đây (ví dụ: exynos9810-crownlteks_defconfig)
          make exynos9810-crownlteks_defconfig
          make -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Kernel-Image
          path: arch/arm64/boot/Image
          
